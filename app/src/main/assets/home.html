<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scriptoria</title>
<style>
  :root {
    --bg:#020617; --surface:#0F172A; --surface-2:#1E293B;
    --text:#F8FAFC; --muted:#94A3B8; --primary:#6366F1; --border:#24324a; --danger:#EF4444;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
  }
  .brand { font-size:30px; font-weight:700; letter-spacing:-.5px; margin:18px 0 22px; }
  .brand span { color:var(--primary); }
  form.search { width:100%; max-width:560px; display:flex; gap:8px; margin-bottom:30px; }
  input {
    flex:1; min-width:0; padding:14px 18px; font-size:16px; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-radius:26px; outline:none;
  }
  input::placeholder { color:var(--muted); }
  input:focus { border-color:var(--primary); }
  button { font:inherit; border:0; border-radius:26px; }
  .go { padding:0 20px; font-size:15px; font-weight:600; color:#fff; background:var(--primary); }
  h2 {
    width:100%; max-width:560px; margin:0 0 12px; font-size:11px; font-weight:700;
    letter-spacing:1.2px; text-transform:uppercase; color:var(--muted);
  }
  .grid {
    width:100%; max-width:560px; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:12px;
  }
  .tile {
    position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:16px 6px; text-decoration:none; color:var(--text); background:var(--surface);
    border:1px solid var(--border); border-radius:16px; cursor:pointer;
  }
  .tile:active { background:var(--surface-2); }
  .icon {
    width:42px; height:42px; border-radius:12px; display:flex; align-items:center;
    justify-content:center; font-size:21px; font-weight:700; color:#fff;
  }
  .label {
    font-size:11.5px; text-align:center; line-height:1.25; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .remove {
    position:absolute; top:-7px; right:-7px; width:23px; height:23px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--border); color:var(--muted);
    font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .add .icon { background:var(--surface-2); color:var(--muted); border:1px dashed var(--border); }
  dialog {
    width:min(420px,90vw); padding:22px; color:var(--text); background:var(--surface);
    border:1px solid var(--border); border-radius:18px;
  }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h3 { margin:0 0 16px; font-size:17px; }
  dialog input { width:100%; margin-bottom:10px; border-radius:12px; font-size:15px; padding:12px 14px; }
  .row { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  .row button { padding:10px 18px; font-size:14px; font-weight:600; border-radius:12px; }
  .cancel { background:var(--surface-2); color:var(--text); }
  .save { background:var(--primary); color:#fff; }
  .err { color:var(--danger); font-size:12.5px; min-height:16px; margin-bottom:6px; }
</style>
</head>
<body>
  <div class="brand">Script<span>oria</span></div>

  <form class="search" action="https://www.google.com/search" method="GET">
    <input name="q" type="search" placeholder="Search Google" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
    <button class="go" type="submit">Search</button>
  </form>

  <h2>Shortcuts</h2>
  <div class="grid" id="grid"></div>

  <dialog id="dlg">
    <h3>Add shortcut</h3>
    <div class="err" id="err"></div>
    <input id="name" placeholder="Name" maxlength="24" autocomplete="off">
    <input id="url" placeholder="example.com" inputmode="url" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row">
      <button class="cancel" id="cancel">Cancel</button>
      <button class="save" id="save">Add</button>
    </div>
  </dialog>

<script>
"use strict";
var KEY = "scriptoria.shortcuts";
// Telegram is built in rather than stored, so it cannot be removed by accident and is
// always present on a fresh install.
var BUILT_IN = [{ name: "Telegram", url: "https://web.telegram.org/a/", color: "#2AABEE" }];
var PALETTE = ["#6366F1","#0EA5E9","#10B981","#F59E0B","#EF4444","#8B5CF6","#EC4899","#14B8A6"];

var grid = document.getElementById("grid");
var dlg = document.getElementById("dlg");
var errEl = document.getElementById("err");
var nameEl = document.getElementById("name");
var urlEl = document.getElementById("url");

// Persisted natively. This page is served from file:///android_asset, which Chromium treats
// as an opaque origin, so localStorage here survives only until the page is torn down.
// localStorage stays as the fallback for anywhere the bridge is absent.
var bridge = window.ScriptoriaNativeBridge;
var hasNative = !!(bridge && typeof bridge.getHomeShortcuts === "function");

function load() {
  try {
    var raw = hasNative ? bridge.getHomeShortcuts() : localStorage.getItem(KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];   // storage blocked or corrupt: fall back to built-ins only
  }
}

function save(list) {
  var json = JSON.stringify(list);
  try {
    if (hasNative) bridge.setHomeShortcuts(json);
    else localStorage.setItem(KEY, json);
  } catch (e) {}
}

function colorFor(name) {
  var sum = 0;
  for (var i = 0; i < name.length; i++) sum += name.charCodeAt(i);
  return PALETTE[sum % PALETTE.length];
}

// Accepts "example.com" as readily as a full URL, and rejects anything that is not http(s).
function normalize(input) {
  var raw = (input || "").trim();
  if (!raw) return null;
  if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;
  try {
    var u = new URL(raw);
    if (u.protocol !== "http:" && u.protocol !== "https:") return null;
    if (!u.hostname || u.hostname.indexOf(".") === -1) return null;
    return u.href;
  } catch (e) {
    return null;
  }
}

function tile(item, index) {
  var a = document.createElement("a");
  a.className = "tile";
  a.href = item.url;

  var icon = document.createElement("div");
  icon.className = "icon";
  icon.style.background = item.color || colorFor(item.name);
  icon.textContent = (item.name[0] || "?").toUpperCase();

  var label = document.createElement("div");
  label.className = "label";
  label.textContent = item.name;

  a.appendChild(icon);
  a.appendChild(label);

  if (index !== null) {
    var rm = document.createElement("button");
    rm.className = "remove";
    rm.textContent = "×";
    rm.setAttribute("aria-label", "Remove " + item.name);
    rm.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();     // the tile is a link; do not follow it
      var list = load();
      list.splice(index, 1);
      save(list);
      render();
    });
    a.appendChild(rm);
  }
  return a;
}

function render() {
  grid.textContent = "";
  BUILT_IN.forEach(function (item) { grid.appendChild(tile(item, null)); });
  load().forEach(function (item, i) { grid.appendChild(tile(item, i)); });

  var add = document.createElement("button");
  add.className = "tile add";
  add.innerHTML = '<div class="icon">+</div><div class="label">Add</div>';
  add.addEventListener("click", function () {
    errEl.textContent = "";
    nameEl.value = "";
    urlEl.value = "";
    dlg.showModal();
    nameEl.focus();
  });
  grid.appendChild(add);
}

document.getElementById("cancel").addEventListener("click", function () { dlg.close(); });

document.getElementById("save").addEventListener("click", function () {
  var url = normalize(urlEl.value);
  if (!url) { errEl.textContent = "Enter a valid web address."; return; }
  var name = nameEl.value.trim() || new URL(url).hostname.replace(/^www\./, "");
  var list = load();
  list.push({ name: name, url: url });
  save(list);
  dlg.close();
  render();
});

render();
</script>
</body>
</html>
